[project]
name = "agents-lib-ai-code-detector"
version = "0.2.0"
description = "AI Code Detector agent for agents-lib"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agents-lib-core",
    # 0.26.0 corrupts memory (reproducible access violation parsing TypeScript, 2026-10-18);
    # 0.24-0.25.2 are fine. Lift the cap only after re-running tests/test_signals.py on a
    # large TS repo.
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.entry-points."agents_lib.agents"]
ai-code-detector = "ai_code_detector.agent:AICodeDetector"

[tool.agents-lib]
id = "ai-code-detector"
stage = "experimental"
mirror = "Waddah0-0/agents-lib-ai-code-detector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_code_detector"]
