[project]
name = "agents-lib-ai-code-detector"
version = "0.1.0"
description = "AI Code Detector agent for agents-lib"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agents-lib-core",
]

[project.entry-points."agents_lib.agents"]
ai-code-detector = "ai_code_detector.agent:AICodeDetector"

[tool.agents-lib]
id = "ai-code-detector"
stage = "experimental"
mirror = "Waddah0-0/agents-lib-ai-code-detector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_code_detector"]
