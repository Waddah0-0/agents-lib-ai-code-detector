[project]
name = "margin-ai-code-detector"
version = "0.2.1"
description = "Estimates how likely a codebase was written with AI assistance, as a range with the evidence for and against."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waddah Ali" }]
keywords = ["ai-detection", "code-analysis", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "margin-core>=0.1.1,<0.2",  # 0.1.1: git and clone safety fixes
    # 0.26.0 corrupts memory (reproducible access violation parsing TypeScript, 2026-10-18);
    # 0.24-0.25.2 are fine. Lift the cap only after re-running tests/test_signals.py on a
    # large TS repo.
    "tree-sitter>=0.24,<0.26",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.entry-points."margin.agents"]
ai-code-detector = "ai_code_detector.agent:AICodeDetector"

[tool.margin]
id = "ai-code-detector"
stage = "experimental"
mirror = "Waddah0-0/margin-ai-code-detector"

[project.urls]
Homepage = "https://github.com/Waddah0-0/margin"
Source = "https://github.com/Waddah0-0/margin/tree/main/agents/ai_code_detector"
Issues = "https://github.com/Waddah0-0/margin/issues"
Changelog = "https://github.com/Waddah0-0/margin/blob/main/agents/ai_code_detector/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_code_detector"]
