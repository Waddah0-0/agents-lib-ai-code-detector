[project]
name = "agents-lib-ai-code-detector"
version = "0.1.0"
description = "AI Code Detector agent for agents-lib"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agents-lib-core",
]

[tool.uv.sources]
agents-lib-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_code_detector"]
